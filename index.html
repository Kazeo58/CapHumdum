<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เกมเศรษฐี</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#37343f;--ink:#1b2430;--gold:#ffc83d}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Sarabun,system-ui,sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,.t{font-family:Mitr,Sarabun,sans-serif;font-weight:500}
button,input{font:inherit}
.scr{display:none;height:100%;overflow:auto;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:10px}
.scr.on{display:flex}
.box{background:#ffffff1c;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px;width:min(100%,340px)}
input{padding:11px 12px;border-radius:10px;border:0;background:#fff;color:var(--ink);width:100%;font-size:16px}
.btn{padding:12px 16px;border:0;border-radius:11px;background:var(--gold);color:#2a1d00;font-weight:700;font-size:16px;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.96)}.btn.g{background:#ffffff2e;color:#fff}.btn:disabled{opacity:.4}
#lobby .code{font-size:38px;letter-spacing:5px;color:var(--gold)}
#game{justify-content:flex-start;align-items:stretch;max-width:560px;margin:0 auto;width:100%;gap:8px;padding:8px}
#top{text-align:center;line-height:1.25;font-size:16px}#top b{color:#7ee08a;font-size:24px}
#bw{position:relative;width:100%;container-type:inline-size;flex:none}
#board{width:100%;aspect-ratio:1;display:grid;grid-template:repeat(9,1fr)/repeat(9,1fr);gap:.5cqw;background:#e4ebee;border-radius:10px;overflow:hidden;padding:.5cqw}
.c{position:relative;display:flex;flex-direction:column;background:#fff;color:var(--ink);overflow:hidden;cursor:pointer;text-align:center;border-radius:.8cqw}
.pt{height:36%;display:flex;align-items:center;justify-content:center;gap:.4cqw;font-size:2.5cqw;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--g) 55%,#fff)}
.nm{flex:1;display:flex;align-items:center;justify-content:center;background:var(--g);color:#fff;font-weight:700;font-size:2.3cqw;line-height:1.05;padding:0 .3cqw;overflow-wrap:anywhere;text-shadow:0 1px 1px #0007}
.c.sp{background:#f3f7f9;color:#2f4a63;align-items:center;justify-content:center;gap:.6cqw}
.c.sp svg{width:5cqw;height:5cqw}.nm2{font-size:2.1cqw;font-weight:700;line-height:1}
.c.own::after{content:'';position:absolute;inset:0;border:.9cqw solid var(--o);border-radius:.8cqw;pointer-events:none}
.hs{width:1.5cqw;height:1.5cqw;background:#fff;border:1px solid var(--ink);display:inline-block}
.bg{font-style:normal;background:var(--ink);color:#fff;border-radius:50%;width:2.7cqw;height:2.7cqw;font-size:1.8cqw;display:inline-flex;align-items:center;justify-content:center}
.tk{position:absolute;left:0;right:0;top:38%;display:flex;justify-content:center;flex-wrap:wrap;gap:.3cqw;pointer-events:none}
.tk i{width:3.4cqw;height:3.4cqw;border-radius:50%;border:.5cqw solid #fff;box-shadow:0 1px 3px #000a}
#mid{grid-area:2/2/9/9;background:#c9dde4;border-radius:2cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;color:var(--ink);text-align:center}
#mid svg.bd{width:34cqw}#dice{display:flex;gap:2.5cqw;height:9cqw}.die{width:9cqw;height:9cqw;filter:drop-shadow(0 1px 2px #0005)}
#turn{font-weight:700;font-size:3.6cqw;display:flex;align-items:center;gap:1.2cqw}#turn i{width:4cqw;height:4cqw;border-radius:50%;border:.5cqw solid #fff;box-shadow:0 1px 3px #0007}
#note{position:absolute;left:50%;top:50%;width:76%;padding:4cqw 11cqw;border-radius:2cqw;background:linear-gradient(135deg,#e2f6cf,#a5d98f);color:#12361a;border:1cqw double #2f8a46;text-align:center;font-weight:700;font-size:4.4cqw;line-height:1.25;box-shadow:0 2cqw 5cqw #0007;opacity:0;pointer-events:none;z-index:5;transform:translate(-50%,-50%)}
#note::before,#note::after{content:'฿';position:absolute;top:50%;width:8cqw;height:8cqw;margin-top:-4cqw;border-radius:50%;border:.7cqw solid #2f8a46;background:#f4fbe9;display:flex;align-items:center;justify-content:center;font-size:5cqw}
#note::before{left:1.5cqw}#note::after{right:1.5cqw}
#note.on{animation:note 2.6s both}
@keyframes note{0%{opacity:0;transform:translate(-50%,-30%) scale(.85)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
#pls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc{position:relative;display:flex;align-items:center;gap:9px;padding:9px;border-radius:12px;background:#ffffff16;border:2px solid transparent}
.pc.on{border-color:var(--gold);background:#ffffff26}.pc.out{opacity:.35;text-decoration:line-through}
.tkn{width:36px;height:36px;border-radius:50%;border:3px solid #fff;flex:none;box-shadow:0 2px 5px #0008}
.nmx{font-weight:700;font-size:15px}.mn{font-weight:700;font-size:15px}.mn span{color:#7ee08a}.mn.neg,.mn.neg span{color:#ff9588}
.sm{font-size:12px;opacity:.85}#pls>.sm{grid-column:1/-1;padding:0 4px}
#acts{display:flex;flex-wrap:wrap;gap:8px}#acts .btn{flex:1 1 42%;padding:14px}#acts .box{flex:1 1 100%;width:auto;text-align:center}
.fl{position:absolute;right:10px;top:4px;font-weight:700;animation:fl 1.2s forwards;text-decoration:none}
.fl.up{color:#7ee08a}.fl.dn{color:#ff9588}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
#modal.on{display:flex}#modal .box{background:#f1f5f7;color:var(--ink);animation:in .18s}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.4cqw)}}
.tk i.hop{animation:hop .3s}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #fffa}60%{box-shadow:0 0 0 1.4cqw #fff0}}
.tk i.me{animation:pulse 1.4s infinite}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.c.pop{animation:pop .6s;z-index:2}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-1.5cqw)}100%{transform:rotate(-8deg)}}
#dice.shake{animation:shake .16s infinite}
@keyframes fl{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
@keyframes in{from{transform:scale(.9);opacity:0}}
@keyframes drop{from{transform:translateY(-18px) rotate(-6deg);opacity:0}}
#menu h1{animation:drop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 6s linear infinite}#mdie .die{width:46px;height:46px}
@keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}
.cf{position:fixed;top:-10vh;z-index:30;pointer-events:none;animation:fall 3s linear forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}#note.on{opacity:1}}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-9px,3px) rotate(-.7deg)}40%{transform:translate(9px,-3px) rotate(.7deg)}60%{transform:translate(-6px,-2px)}80%{transform:translate(6px,2px)}}
#bw.quake{animation:quake .5s}
#modal .box{max-height:92dvh;overflow:auto}
.c.fc{gap:.2cqw}.c.fc svg{width:4cqw;height:4cqw}.fp{font-size:2cqw;font-weight:700}
.rps{display:flex;gap:8px}.rps .btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 2px;font-size:14px}.rps .btn span{font-size:32px;line-height:1.1}
.rv{display:flex;justify-content:space-around;text-align:center;font-size:46px;line-height:1.1}.rv div div{font-size:13px;font-weight:700}
</style>
</head>
<body>

<div id="menu" class="scr on">
  <div class="box" style="align-items:center"><h1 style="font-size:34px">เกมเศรษฐี</h1><div class="spin" id="mdie"></div><div>เล่นกับเพื่อนได้ 2–4 คน</div></div>
  <div class="box">
    <input id="name" placeholder="ชื่อของคุณ" maxlength="10">
    <button class="btn" id="mk">สร้างห้อง</button>
    <input id="room" placeholder="รหัสห้อง" maxlength="5" style="text-transform:uppercase">
    <button class="btn g" id="jn">เข้าร่วมห้อง</button>
    <div id="err" style="color:#ffb4a8;font-size:13px"></div>
  </div>
</div>

<div id="lobby" class="scr">
  <div class="box" style="align-items:center"><h1 style="font-size:28px">เกมเศรษฐี</h1><div>รหัสห้อง</div><div class="code t" id="lc"></div>
    <button class="btn g" id="cp">คัดลอกลิงก์เชิญเพื่อน</button></div>
  <div class="box"><div class="t">ผู้เล่น</div><div id="lp" style="display:flex;flex-direction:column;gap:5px"></div>
    <button class="btn g" id="ab"> เพิ่มบอท</button><button class="btn" id="st">เริ่มเกม</button><div id="wt" style="font-size:13px"></div></div>
</div>

<div id="game" class="scr"><div id="top"></div><div id="bw"><div id="board"></div><div id="note"></div></div><div id="pls"></div><div id="acts"></div></div>
<div id="modal"></div>

<script>
const $=s=>document.querySelector(s);
const COL=['#e5372d','#2f7df6','#f5b800','#8f4fe0'];
const GC=['#8d5a3b','#0e9ad6','#f08a1c','#d6307a','#d93a2f','#c79200','#1f9d63','#4b3fc4'];
const P=(n,pr,g)=>({k:'p',n,pr,g}),S=(k,n,e)=>({k,n,e}),F=(n,pr,ic)=>({k:'f',n,pr,ic,g:9});
GC[9]='#4a5a6a';
const N=32,JAIL=8,FB=[0,20,40,80,150],RPS_WIN=100,RPS_STEAL=false,TR_BONUS=100;
const T=[S('go','เริ่มต้น',''),P('ลาว',60,0),S('ch','โชค',''),P('กัมพูชา',60,0),F('สนามบิน',200,'air'),P('เวียดนาม',100,1),S('tax','ภาษี',''),P('มาเลเซีย',100,1),S('jail','คุก',''),
P('อินเดีย',140,2),P('บราซิล',140,2),S('ln','กู้เงิน',''),F('ท่าเรือ',200,'port'),P('เม็กซิโก',160,2),P('อียิปต์',180,3),P('ตุรกี',180,3),S('park','จอดพัก',''),
P('รัสเซีย',220,4),S('cd','จั่วการ์ด',''),P('จีน',240,4),F('รถไฟ',200,'rail'),P('เกาหลี',220,4),P('อิตาลี',260,5),P('สเปน',260,5),S('gj','ไปคุก',''),
P('เยอรมนี',300,6),P('อังกฤษ',300,6),S('tr','แลกเมือง',''),F('โรงไฟฟ้า',200,'bolt'),P('ฝรั่งเศส',320,6),P('ญี่ปุ่น',380,7),P('อเมริกา',420,7)];
const CARDS=[['ถูกลอตเตอรี่ +150',150],['ค่าซ่อมรถ -80',-80],['ได้เงินปันผล +100',100],['ค่าปรับจราจร -50',-50],['ไปเที่ยวทะเล รับ 200 ที่จุดเริ่มต้น','go'],['ถูกจับ ไปคุก!','jail']];
const DP=[[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const die=n=>`<svg class="die" viewBox="0 0 30 30"><rect width="30" height="30" rx="6" fill="#fff"/>${DP[n-1].map(k=>`<circle cx="${8+k%3*7}" cy="${8+(k/3|0)*7}" r="2.6" fill="#1b2430"/>`).join('')}</svg>`;
const IC={go:'<path d="M3 12h15M12 5l7 7-7 7"/>',jail:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16M15 4v16"/>',park:'<circle cx="12" cy="12" r="8"/><path d="M10 17V8h3a2.5 2.5 0 010 5h-3"/>',gj:'<path d="M12 3l9 17H3z"/><path d="M12 10v5M12 18v.5"/>',tax:'<circle cx="12" cy="12" r="8"/><path d="M9 8v8M9 9h5a2 2 0 010 4H9"/>',ch:'<circle cx="12" cy="12" r="8"/><path d="M9.5 9.5a2.5 2.5 0 115 0c0 2-2.5 2-2.5 4M12 17v.5"/>',ln:'<path d="M3 9l9-5 9 5zM5 11v7M10 11v7M14 11v7M19 11v7M3 20h18"/>',cd:'<rect x="4" y="6" width="12" height="15" rx="2"/><path d="M8 3h10a2 2 0 012 2v12"/>'};
Object.assign(IC,{tr:'<path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/>',rail:'<rect x="6" y="3" width="12" height="14" rx="3"/><path d="M6 11h12M9 21l2-4M15 21l-2-4"/><circle cx="9.5" cy="14" r=".6"/><circle cx="14.5" cy="14" r=".6"/>',port:'<circle cx="12" cy="5" r="2"/><path d="M12 7v14M7 11h10M5 15a7 7 0 0014 0"/>',air:'<path d="M21 15l-8-4V5a1.5 1.5 0 00-3 0v6l-8 4v2l8-2v4l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-4l8 2z"/>',bolt:'<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>'});
const ico=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const BLD='<svg class="bd" viewBox="0 0 120 90"><path d="M60 8a22 18 0 0122 18H38A22 18 0 0160 8z" fill="#d7c9a3"/><rect x="28" y="26" width="64" height="12" fill="#efe6cc"/><rect x="34" y="38" width="52" height="34" fill="#e6dcc0"/><g fill="#8fb8c2"><rect x="40" y="44" width="8" height="12"/><rect x="56" y="44" width="8" height="12"/><rect x="72" y="44" width="8" height="12"/></g><rect x="20" y="72" width="80" height="8" fill="#8a8594"/></svg>';
const WIN=5000;
const CK=['seize','storm','flood','shark','helmet','swap','rob','frog'];
const CN={seize:'ยึดโฉนดชั่วคราว',storm:'พายุเข้า',flood:'น้ำท่วม',shark:'เจ้าหนี้หน้าเลือด',helmet:'หมวกกันน็อค',swap:'สลับที่',rob:'ล้วงกระเป๋า',frog:'คำสาปกบ'};
const CI={seize:'',storm:'',flood:'',shark:'',helmet:'',swap:'',rob:'',frog:''};
const CD={seize:'เลือกที่ดินเพื่อน 1 แปลง คนต่อไปที่ลงที่นั่นจะจ่ายค่าเช่าให้คุณ 1 ครั้ง แล้วคืนโฉนด',storm:'เลือกที่ดินเพื่อน เจ้าของได้ค่าเช่าแค่ครึ่งเดียว 3 ครั้ง',flood:'เลือกที่ดินเพื่อน ห้ามอัพเกรด 3 เทิร์นของเจ้าของ',shark:'เลือกลูกหนี้ของคุณ ต้องคืนเงินเป็น 2 เท่า',helmet:'ยกเลิกการ์ดที่ใครก็ตามใช้ (ใช้ตอบโต้ได้ทันที)',swap:'สลับตำแหน่งบนกระดานกับเพื่อน 1 คน (ใครติดคุกอยู่สลับไม่ได้)',rob:'ล้วงกระเป๋าเพื่อน 1 คน ได้เงินสด ฿150',frog:'สาปเพื่อนเป็นกบ ต้องกระโดดข้ามตาหน้า'};
const PT={swap:1,rob:1,frog:1};
const rcard=()=>CK[Math.floor(Math.random()*CK.length)];
const tgt=q=>q.c==='shark'?'':PT[q.c]?' กับ '+st.pl[q.t].n:' ที่'+T[q.t].n;
const CH=[['แมวคาบเงินในกระเป๋าไปเลี้ยงลูก เสีย ฿80',['m',-80]],['ถูกหวยกินแต่ได้เลขท้าย ฿150',['m',150]],['ขึ้นรถเมล์ผิดสาย เดินหน้า 4 ช่อง',['f',4]],['แม่โทรตามให้กลับบ้าน ถอยหลัง 3 ช่อง',['f',-3]],['จัดปาร์ตี้เลี้ยงทุกคน จ่ายคนละ ฿30',['all',-30]],['วันเกิดคุณ! ทุกคนมอบเงินให้คนละ ฿40',['all',40]],['ตู้ ATM คายเงินผิดพลาด ได้ ฿100',['m',100]],['วินมอเตอร์ไซค์โก่งราคา จ่าย ฿60',['m',-60]],['ลูกเต๋าตกท่อ ถูกเนรเทศไปคุก',['j']],['ไปเที่ยวทะเล ถึงจุดเริ่มต้นรับ ฿200',['go']],['เทเลพอร์ตมั่ว ไปโผล่ช่องสุ่ม',['tp']],['สลับกระเป๋าเงินกับคนจนที่สุด ห้ามโวย',['swc']]];
let turnDl=0,lastKey='',endAt=0,cdl=0;
let peer,hostConn,lobby=[],st=null,me=-1,isHost=false,code='';

/* ---------- helpers ---------- */
const full=(o,g)=>T.every((t,i)=>t.g!==g||st.own[i]===o);
const rent=i=>{const t=T[i];if(t.k==='f'){const o=st.own[i];return FB[T.reduce((a,x,k)=>a+(x.k==='f'&&st.own[k]===o?1:0),0)]}const l=st.lv[i]||0;let r=t.pr/10*[1,2,4,7][l];if(!l&&full(st.own[i],t.g))r*=2;return Math.round(r)};
const bcost=i=>Math.round(T[i].pr/20)*10;
const L=m=>{st.ln=(st.ln||0)+1;st.log.push(m);if(st.log.length>6)st.log.shift()};
const rnd=()=>1+Math.floor(Math.random()*6);
const nw=i=>{let v=st.pl[i].m;for(const k in st.own)if(st.own[k]==i)v+=T[k].pr+(st.lv[k]||0)*bcost(k);st.loans.forEach(q=>{if(q.b===i)v-=1000;if(q.l===i)v+=1000});return v};
const closeM=()=>{const m=$('#modal');m.classList.remove('on');m.dataset.k=''};

/* ---------- host game logic ---------- */
function newGame(){
  st={pl:lobby.map((x,i)=>({n:x.n,c:COL[i],pos:0,m:1500,j:0,out:0,bot:!!x.bot})),own:{},lv:{},cards:lobby.map(()=>[rcard(),rcard()]),loans:[],lid:0,seize:{},storm:{},flood:{},pend:null,turn:0,ph:'roll',dice:[0,0],rc:0,mv:0,dbl:0,ln:1,log:['เริ่มเกม! ทรัพย์สินรวมถึง ฿'+WIN.toLocaleString()+' ชนะ'],win:null};
  bcast();
}
function bust(i){
  const p=st.pl[i];p.out=1;L(p.n+' แพ้! เงินติดลบเกิน ฿500');
  for(const k in st.own)if(st.own[k]==i){delete st.own[k];delete st.lv[k]}
  for(const k in st.seize)if(st.seize[k]==i)delete st.seize[k];
  st.loans=st.loans.filter(q=>q.b!==i&&q.l!==i);st.cards[i]=[];
  const al=st.pl.filter(x=>!x.out);if(al.length<2)st.win=st.pl.indexOf(al[0]);
}
function pay(i,to,a){const p=st.pl[i];p.m-=a;if(to!=null)st.pl[to].m+=a;if(p.m<=-500)bust(i)}
function next(){
  if(st.win!=null)return;
  do{st.turn=(st.turn+1)%st.pl.length}while(st.pl[st.turn].out);
  const i=st.turn;st.dbl=0;st.ph='roll';st.rps=null;st.tr=null;st.after=null;clearTimeout(rpsT);
  for(const k in st.flood)if(st.own[k]===i&&--st.flood[k]<=0)delete st.flood[k];
  const keep=[];
  st.loans.forEach(q=>{if(q.b!==i||st.pl[i].out){keep.push(q);return}

}
$('#st').onclick=()=>{if(isHost&&lobby.length>1)newGame()};
$('#cp').onclick=()=>{const u=location.href.split('?')[0]+'?room='+code;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>$('#cp').textContent='คัดลอกแล้ว แล้ว').catch(()=>prompt('ส่งลิงก์นี้ให้เพื่อน',u))};
$('#mdie').innerHTML=die(5);
setInterval(()=>{
  if(!isHost||!st||st.win!=null||st.pend)return;
  const now=Date.now();
  if(st.ph==='rps'&&st.rps){const r=st.rps;if(r.res)return;
    if(st.pl[r.a].out||st.pl[r.b].out){rpsDone();return}
    if(now>r.dl)[r.a,r.b].forEach(k=>{if(st.rps===r&&r.ch[k]==null)act(k,'rps',Math.floor(Math.random()*3))});return}
  if(st.ph==='trw'){const r=st.tr;if(!r){st.ph='end';bcast();return}if(now>r.dl||st.pl[r.to].out){trResolve(false);bcast()}return}
  if(st.ph==='end'){if(busy()){endAt=0;return}if(!endAt)endAt=now+1200;if(now>=endAt){endAt=0;act(st.turn,'end')}return}
  endAt=0;
  if(!isBot(st.turn)&&now>turnDl&&!busy()){if(st.ph==='roll')act(st.turn,'roll');else if(st.ph==='buy'||st.ph==='loan'||st.ph==='trade')act(st.turn,'skip')}
},300);
setInterval(()=>{
  if(!st)return;
  const n=Math.max(0,Math.min(30,Math.ceil((cdl-Date.now())/1000))),bot=st.pl[st.turn]&&st.pl[st.turn].bot;
  const e=$('#cd');if(e){e.textContent=st.win!=null||bot?'':'เหลือเวลา '+n+' วิ';e.style.color=n<=10?'#c0261d':''}
  const m=$('#mcd');if(m)m.textContent=n;
},250);
const q=new URLSearchParams(location.search).get('room');if(q)$('#room').value=q.toUpperCase();
</script>
